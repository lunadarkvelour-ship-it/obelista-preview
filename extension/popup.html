<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Obelista Ingest</title>
    <style>
      body { font: 13px/1.4 system-ui, -apple-system, sans-serif; width: 260px; margin: 0; padding: 12px 14px; color: #111; }
      h1 { font-size: 13px; margin: 0 0 8px; }
      .row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
      .pill { padding: 2px 8px; border-radius: 10px; font-size: 11px; }
      .pill.ok { background: #e6f4ea; color: #0a7d27; }
      .pill.err { background: #fce8e6; color: #b00020; }
      .pill.idle { background: #f1f1f1; color: #555; }
      a, button { font: inherit; cursor: pointer; }
      .open { display: inline-block; margin-top: 10px; padding: 6px 10px; background: #111; color: #fff; border: 0; border-radius: 4px; text-decoration: none; }
      .meta { color: #666; font-size: 11px; margin-top: 4px; word-break: break-all; }
      .drops { margin-top: 8px; border-top: 1px solid #eee; padding-top: 6px; }
      .drop { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; line-height: 1.5; }
      .drop .t { color: #888; flex: 0 0 auto; }
      .drop .s { color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .empty { color: #999; font-size: 11px; font-style: italic; }
      .refresh { display: block; width: 100%; margin-top: 10px; padding: 6px 10px; background: #f5f5f5; color: #111; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
      .refresh:hover:not(:disabled) { background: #ebebeb; }
      .refresh:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <h1>Obelista Ingest</h1>
    <div class="row"><span>Status</span><span id="status" class="pill idle">…</span></div>
    <div class="meta" id="meta">…</div>
    <div class="drops" id="drops"></div>
    <button class="refresh" id="refresh" type="button">Refresh token</button>
    <a class="open" id="open-options" href="#">Open options</a>
    <script src="popup.js"></script>
  </body>
</html>
