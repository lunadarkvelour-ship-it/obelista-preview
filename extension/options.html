<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Obelista Ingest — Options</title>
    <style>
      body { font: 14px/1.4 system-ui, -apple-system, sans-serif; max-width: 560px; margin: 32px auto; color: #111; }
      h1 { font-size: 18px; margin: 0 0 16px; }
      label { display: block; margin: 12px 0 4px; font-weight: 600; }
      input { width: 100%; padding: 8px 10px; box-sizing: border-box; font: inherit; border: 1px solid #ccc; border-radius: 4px; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
      button { padding: 8px 14px; font: inherit; border: 1px solid #111; background: #111; color: #fff; border-radius: 4px; cursor: pointer; }
      button.secondary { background: #fff; color: #111; }
      pre { background: #f5f5f5; padding: 12px; border-radius: 4px; overflow: auto; font-size: 12px; margin: 16px 0 0; }
      .ok { color: #0a7d27; }
      .err { color: #b00020; }
    </style>
  </head>
  <body>
    <h1>Obelista Ingest</h1>
    <label for="endpoint">Ingest endpoint</label>
    <input id="endpoint" type="url" placeholder="https://obelista-preview.vercel.app/api/extension/ingest" />
    <div class="row">
      <button id="save">Save</button>
      <button id="test" class="secondary">Test connection</button>
      <button id="drop" class="secondary">Send test drop</button>
    </div>
    <pre id="out">Not saved yet.</pre>
    <script src="options.js"></script>
  </body>
</html>
