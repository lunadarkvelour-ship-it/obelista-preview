<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Obelista: буква O с акцентной перекладиной — той же, что у E в вордмарке.
       Цвета зашиты числами намеренно: фавикон отдаётся файлом, до CSS-переменных
       панели он не дотягивается.

       Перекладина — #C422CA, акцент БРЕНДА из логотипа владельца. Прежде здесь
       стоял лайм #CBFB8F, акцент ИНТЕРФЕЙСА: пока настоящего логотипа не было,
       взяли то, что под рукой. Это разные вещи, и их легко перепутать, потому
       что оба «акцентные»: интерфейсный человек может сменить в настройках
       панели, брендовый — нет, он часть подписи. Вкладка обязана совпадать с
       тем, что человек видит в шапке, иначе продукт выглядит как два разных. -->
  <rect width="512" height="512" rx="96" fill="#151517"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#FAFAFA" stroke-width="34"/>
  <path d="M125 256 H290" fill="none" stroke="#C422CA" stroke-width="34"/>
</svg>
